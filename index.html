<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>街球派對 大廳</title>
<link rel="icon" type="image/svg+xml" href="street-hoops-logo.svg">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei",sans-serif;color:#fff}
  body{background:radial-gradient(circle at 50% 0%,#2b3563 0%,#10131f 60%);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
  h1{margin:10px 0 0;font-size:34px;letter-spacing:2px;color:#ffd84a;text-shadow:0 3px 0 #a8452f}
  .sub{color:#aab;margin:6px 0 22px;font-size:14px}
  .ball{font-size:56px;animation:bounce .8s ease-in-out infinite alternate}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-26px)}}
  .cards{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%;max-width:640px}
  .card{flex:1 1 260px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.2);border-radius:16px;padding:18px;text-decoration:none;color:#fff;transition:.15s}
  .card:hover,.card:active{transform:scale(1.03);border-color:#ffd84a;background:rgba(255,216,74,.12)}
  .card h2{margin:0 0 6px;font-size:22px}
  .card p{margin:0;font-size:13px;color:#ccd;line-height:1.6}
  .tag{display:inline-block;margin-top:10px;padding:2px 10px;border-radius:99px;font-size:12px;background:#d8362b}
  .tag.b{background:#2a5bd7}
  details{width:100%;max-width:640px;margin-top:22px;background:rgba(0,0,0,.3);border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.7}
  summary{cursor:pointer;color:#ffd84a;font-weight:bold}
</style>
</head>
<body>
  <div class="ball">🏀</div>
  <h1>街球派對</h1>
  <div class="sub">半場 · 投籃條 · 花式動作</div>

  <div class="cards">
    <a class="card" href="practice.html">
      <h2>🎯 練習模式</h2>
      <p>自由練習投籃、運球、上籃、灌籃。有電腦防守者,也可以關掉防守。</p>
      <span class="tag">單人</span>
    </a>
    <a class="card" href="online.html">
      <h2>🌐 線上 1v1</h2>
      <p>建立房間,把房號給朋友,兩個人一起打。先得 11 分獲勝。</p>
      <span class="tag b">雙人連線</span>
    </a>
  </div>

  <details>
    <summary>操作簡介</summary>
    <div>
      移動:左下搖桿(電腦 WASD)<br>
      投籃:按住投籃鍵,抓綠區放開(電腦 J)<br>
      花式動作:按住投籃鍵時,拖曳搖桿換動作<br>
      加速:電腦 L　換手運球:電腦空白鍵　假動作/抄截:電腦 F
    </div>
  </details>
</body>
</html>
