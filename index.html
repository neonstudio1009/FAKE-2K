<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>半場街球 3D Demo</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:"Microsoft JhengHei",sans-serif}
  #game{position:fixed;inset:0;width:100vw;height:100dvh;object-fit:contain;display:block}
  #joy{position:fixed;left:5vmin;bottom:5vmin;width:30vmin;height:30vmin;max-width:150px;max-height:150px;min-width:110px;min-height:110px;
       border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4)}
  #knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(255,255,255,.6)}
  #pad{position:fixed;right:2vmin;bottom:3vmin;width:260px;height:260px;pointer-events:none}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;
       border:2px solid rgba(255,255,255,.6);text-align:center;font-size:15px;line-height:1.1}
  .btn.on{filter:brightness(1.6);transform:scale(.94)}
  #bShoot{right:0;bottom:0;width:96px;height:96px;background:rgba(230,80,40,.85);font-size:20px}
  #bSprint{right:131px;bottom:16px;width:64px;height:64px;background:rgba(40,130,220,.85)}
  #bCall{right:99px;bottom:99px;width:60px;height:60px;background:rgba(210,160,0,.9)}
  #bCross{right:16px;bottom:131px;width:64px;height:64px;background:rgba(30,160,100,.85)}
  #bFake{right:107px;bottom:172px;width:58px;height:58px;background:rgba(150,70,200,.9);font-size:14px}
  .tbtn{position:fixed;right:8px;padding:6px 10px;background:rgba(0,0,0,.5);color:#fff;border:1px solid #888;border-radius:8px;font-size:13px}
  #bReset{top:8px}
  #bDef{top:44px}
   #help{position:fixed;left:8px;top:48px;width:min(300px,88vw);background:rgba(10,12,20,.9);color:#fff;
        border:1px solid #ffd84a;border-radius:10px;font-size:12px;line-height:1.5;z-index:10}
  #helpHead{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;cursor:pointer;font-weight:bold;color:#ffd84a;font-size:13px}
  #helpBody{padding:0 10px 10px;max-height:50vh;overflow-y:auto;touch-action:pan-y}
  #help.min #helpBody{display:none}
  #help.min{width:auto}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
  .tab{padding:3px 8px;border:1px solid #666;border-radius:6px;background:#222;cursor:pointer}
  .tab.act{background:#ffd84a;color:#000;border-color:#ffd84a;font-weight:bold}
  #help table{width:100%;border-collapse:collapse;margin-top:4px}
  #help th,#help td{border:1px solid #444;padding:3px 5px;text-align:left;vertical-align:top}
  #help th{background:#2a2f45;color:#ffd84a}
  #help p{margin:4px 0}
</style>
</head>
<body>
<canvas id="game" width="500" height="520"></canvas>
<div id="joy"><div id="knob"></div></div>
<div id="pad">
  <div class="btn" id="bShoot">投籃<br>(按住)</div>
  <div class="btn" id="bSprint">加速</div>
  <div class="btn" id="bCall">要球</div>
  <div class="btn" id="bCross">換手<br>運球</div>
  <div class="btn" id="bFake">假動作</div>
</div>
<div class="tbtn" id="bReset">重置</div>
<div class="tbtn" id="bDef">防守:開</div>
<div id="help">
  <div id="helpHead"><span>📖 玩法說明</span><span id="helpArrow">▼ 收起</span></div>
  <div id="helpBody">
    <div class="tabs" id="helpTabs"></div>
    <div id="helpContent"></div>
  </div>
</div>
<script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const W=500,H=470;
const RIM={x:250,y:64},RIMZ=66,G=900,THREE_R=237;
const CAM_C=700,CAM_NEAR=480,CAM_Q=700;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);

function pr(x,y,z=0){
  const s=CAM_C/(H+CAM_C-y);
  return {x:250+(x-250)*s*0.94,y:CAM_NEAR-(1-s)*CAM_Q-z*s,s};
}

// ---------- 動作資料表 ----------
// w:綠區加減(跳投)或寬度(上籃/灌籃) cf:被防守影響程度 pm:命中率倍率 bk:被蓋火鍋倍率
const MV={
  jump:{name:'投籃',w:0,cf:.55,pm:1,bk:1,rel:.25,total:.6,amp:22,disp:0},
  fade:{name:'後仰',w:-.03,cf:.3,pm:.92,bk:.4,rel:.28,total:.65,amp:26,disp:40},
  step:{name:'後撤步',w:-.03,cf:.25,pm:.94,bk:.3,rel:.3,total:.65,amp:24,disp:44},
  side:{name:'側移跳投',w:-.015,cf:.4,pm:.96,bk:.6,rel:.27,total:.62,amp:22,disp:50},
  turn:{name:'轉身投籃',w:-.04,cf:.2,pm:.9,bk:.4,rel:.42,total:.75,amp:24,disp:0,spin:true},
  layup:{name:'上籃',w:.2,cf:.55,pm:1,bk:1,rel:.3,total:.7,amp:34,appr:.45,zoff:56,sdur:.5,peak:16},
  reverse:{name:'反手上籃',w:.2,cf:.45,pm:1,bk:.6,rel:.36,total:.75,amp:34,appr:.5,zoff:56,sdur:.5,peak:22},
  euro:{name:'歐洲步',w:.18,cf:.3,pm:.97,bk:.5,rel:.46,total:.78,amp:32,zoff:56,sdur:.5,peak:16},
  float:{name:'拋投',w:.16,cf:.3,pm:.92,bk:.2,rel:.3,total:.7,amp:30,appr:.3,zoff:62,sdur:.8,peak:55},
  dunk1:{name:'單手灌籃',w:.24,cf:.25,pm:1,bk:0,rel:.7,total:.95,amp:55,shake:.4},
  dunk2:{name:'雙手灌籃',w:.22,cf:.25,pm:1,bk:0,rel:.7,total:.95,amp:58,shake:.5},
  wind:{name:'風車灌籃',w:.18,cf:.25,pm:.95,bk:0,rel:.78,total:1.02,amp:62,shake:.6},
  spin:{name:'360灌籃',w:.15,cf:.25,pm:.9,bk:0,rel:.78,total:1.02,amp:62,shake:.7,spin:true}
};
const HINT={
  jump:'朝籃框=轉身 橫向=側移 斜後=後撤步 遠離=後仰',
  layup:'朝籃框=上籃 斜向=反手 橫向=歐洲步 遠離=拋投',
  dunk:'不推=單手 朝籃框=雙手 橫向=風車 遠離=360'
};

const P={x:250,y:340,vx:0,vy:0,fx:0,fy:-1,z:0,hand:1,state:'free',st:0,stamina:1,cross:0,D:null,mode:'jump',move:'jump',stk:{x:0,y:0,m:0},pending:null,fakeCd:0,imm:0};
const B={x:250,y:340,z:0,vx:0,vy:0,vz:0,mode:'held',lock:0};
const Df={x:250,y:200,vx:0,vy:0,z:0,state:'guard',st:0,stun:0,steal:0,cool:0,react:false,bite:false,rt:0.4};
let defOn=true;
let shot=null,pass=null,meter=0;
const S={score:0,made:0,att:0,streak:0,best:0,threes:0,dunks:0,time:0};
let parts=[],rings=[],banner=null,shake=0,scorePop=0;
let texts=[],netShake=0,time=0;
const input={jx:0,jy:0,sprint:false,keys:{}};

function say(t,c='#fff',x=P.x,y=P.y,z=(P.z||0)+75){texts.push({t,c,x,y,z,life:1.1})}

function reset(){
  Object.assign(P,{x:250,y:340,vx:0,vy:0,z:0,state:'free',D:null,stamina:1,pending:null,move:'jump',fakeCd:0,imm:0});
  Object.assign(B,{mode:'held',z:0,vx:0,vy:0,vz:0,lock:0});
  Object.assign(Df,{x:250,y:200,vx:0,vy:0,z:0,state:'guard',st:0,stun:0,steal:0,cool:0,react:false,bite:false});
  shot=null;pass=null;meter=0;
}
document.getElementById('bReset').addEventListener('pointerdown',reset);
const defBtn=document.getElementById('bDef');
defBtn.addEventListener('pointerdown',()=>{
  defOn=!defOn;defBtn.textContent='防守:'+(defOn?'開':'關');
  Object.assign(Df,{x:250,y:200,vx:0,vy:0,z:0,state:'guard',st:0,stun:0,steal:0,cool:0,react:false,bite:false});
});

// ---------- 搖桿 ----------
const joy=document.getElementById('joy'),knob=document.getElementById('knob');
let joyId=null;
function joyMove(e){
  const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2;
  let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy);
  if(d>R){dx*=R/d;dy*=R/d;d=R}
  input.jx=dx/R;input.jy=dy/R;
  knob.style.transform=`translate(${dx}px,${dy}px)`;
}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
const joyEnd=e=>{if(e.pointerId===joyId){joyId=null;input.jx=input.jy=0;knob.style.transform=''}};
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);

// ---------- 按鈕 ----------
function bindBtn(id,down,up){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);el.classList.add('on');down()});
  const end=()=>{if(!el.classList.contains('on'))return;el.classList.remove('on');up&&up()};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
bindBtn('bShoot',()=>startAim(),()=>releaseShot());
bindBtn('bSprint',()=>input.sprint=true,()=>input.sprint=false);
bindBtn('bCall',()=>callBall());
bindBtn('bCross',()=>crossover());
bindBtn('bFake',()=>pumpFake());

// ---------- 鍵盤 ----------
addEventListener('keydown',e=>{
  if(e.repeat)return;
  input.keys[e.code]=true;
  if(e.code==='KeyJ')startAim();
  if(e.code==='KeyE')callBall();
  if(e.code==='KeyF')pumpFake();
  if(e.code==='Space'){crossover();e.preventDefault()}
});
addEventListener('keyup',e=>{
  input.keys[e.code]=false;
  if(e.code==='KeyJ')releaseShot();
});

// ---------- 動作 ----------
const MODE_NAME={jump:'投籃',layup:'上籃',dunk:'灌籃'};
function modeByDist(d){return d<=85?'dunk':(d<=130?'layup':'jump')}
function modeLabel(){return MV[P.move]?MV[P.move].name:MODE_NAME[P.mode]}
function defaultMove(mode){return mode==='jump'?'jump':(mode==='layup'?'layup':'dunk1')}

// 依搖桿方向決定動作
function pickMove(mode,ax,ay,m){
  if(m<0.5)return defaultMove(mode);
  const dd=Math.hypot(P.x-RIM.x,P.y-RIM.y)||1;
  const ux=(P.x-RIM.x)/dd,uy=(P.y-RIM.y)/dd;
  const th=Math.acos(clamp((ax*ux+ay*uy)/m,-1,1))*180/Math.PI;
  const ph=180-th;
  if(mode==='jump')return th<35?'fade':(th<80?'step':(th<130?'side':'turn'));
  if(mode==='layup')return ph<35?'layup':(ph<80?'reverse':(ph<125?'euro':'float'));
  return ph<40?'dunk2':(ph<120?'wind':'spin');
}

function crossover(){
  if(P.state==='free'&&B.mode==='held'){P.hand*=-1;P.cross=0.3;P.imm=0.6;say('換手運球','#8ff')}
}
function callBall(){
  if(P.state!=='free')return;
  if(B.mode==='held'){say('球在你手上','#ddd');return}
  if(B.mode==='loose'){
    B.mode='pass';pass={sx:B.x,sy:B.y,sz:B.z,t:0};B.vx=B.vy=B.vz=0;
    say('要球!','#fd4');
  }
}
function pumpFake(){
  if(P.state!=='free'||B.mode!=='held'||P.fakeCd>0)return;
  P.state='fake';P.st=0;P.fakeCd=0.7;P.imm=0.8;
  say('假動作!','#c8f');
  if(defOn){
    const d=dist(P.x,P.y,Df.x,Df.y);
    if(d<110&&Df.state==='guard'&&Df.stun<=0&&Math.random()<0.7){
      Df.state='jump';Df.st=0;Df.bite=true;
      say('騙到防守!','#4f4',Df.x,Df.y,Df.z+85);
    }
  }
}
function startAim(){
  if(P.state==='fake'&&B.mode==='held'){P.state='free';P.z=0}
  if(P.state!=='free'||B.mode!=='held')return;
  P.mode=modeByDist(dist(P.x,P.y,RIM.x,RIM.y));
  P.move=defaultMove(P.mode);
  Df.rt=0.25+Math.random()*0.35;
  P.state='aim';meter=0;
}
function greenInfo(){
  const d=dist(P.x,P.y,RIM.x,RIM.y),mv=MV[P.move];
  if(P.mode==='jump')return {c:0.82,w:clamp(0.22-d*0.0006+mv.w,0.04,0.2),d};
  return {c:0.82,w:mv.w,d};
}
function contest(){
  if(!defOn)return 0;
  const vx=Df.x-P.x,vy=Df.y-P.y,d=Math.hypot(vx,vy);
  let c=clamp(1-d/70,0,1);
  const rx=RIM.x-P.x,ry=RIM.y-P.y,rl=Math.hypot(rx,ry)||1;
  const dot=(vx*rx+vy*ry)/((d||1)*rl);
  if(dot<0.3)c*=0.5;
  if(c>0&&Df.state==='jump'&&Df.z>6)c=Math.min(1,c+0.25);
  if(Df.stun>0)c*=0.2;
  return c;
}
function releaseShot(){
  if(P.state!=='aim')return;
  if(meter<0.12){P.state='free';pumpFake();return}
  const mode=P.mode,mvk=P.move,mv=MV[mvk];
  const g=greenInfo(),err=meter-g.c,ae=Math.abs(err),perfect=ae<=g.w/2;
  let p,label,col;
  if(perfect){
    p=mode==='dunk'?1:(mode==='layup'?0.95:0.97);
    label=mvk==='jump'?'完美出手!':'完美'+mv.name+'!';col='#4f4';
  }else if(ae<=g.w*1.3){
    p=mode==='dunk'?0.8:(mode==='layup'?0.65:clamp(0.6-g.d*0.0008,0.2,0.6));
    label='還不錯';col='#ff4';
  }else{
    p=mode==='dunk'?0.1:0.07;
    label=err<0?'太早了':'太晚了';col='#f66';
  }
  const dd=g.d;
  const ux=(P.x-RIM.x)/Math.max(1,dd),uy=(P.y-RIM.y)/Math.max(1,dd);
  const stk=P.stk||{x:0,y:0,m:0};
  // 晃開防守
  if(defOn&&(mvk==='step'||mvk==='euro'||mvk==='reverse')&&dist(P.x,P.y,Df.x,Df.y)<60&&Df.state==='guard'&&Math.random()<0.35){
    Df.stun=Math.max(Df.stun,0.5);
    say('晃開防守!','#4f4',Df.x,Df.y,Df.z+85);
  }
  const c=contest();
  if(c>0.4)say('被干擾','#f96',P.x,P.y,P.z+95);
  p*=(1-mv.cf*c)*mv.pm;
  const block=mode!=='dunk'&&c>0.7&&Math.random()<(c-0.6)*(perfect?0.5:1.2)*mv.bk;
  P.pending={p,mode,perfect,move:mvk,block,d:dd};
  P.fx=-ux;P.fy=-uy;

  const D={x0:P.x,y0:P.y,done:false,ok:Math.random()<p,move:mvk,angle:null,spin:!!mv.spin,
    rel:mv.rel,total:mv.total,amp:mv.amp,disp:mv.disp||0,dx:0,dy:0};
  if(mode==='jump'&&D.disp){
    if(mvk==='fade'||stk.m<=0.1){D.dx=ux;D.dy=uy}
    else{D.dx=stk.x/stk.m;D.dy=stk.y/stk.m}
  }
  if(mode==='layup'){
    D.appr=mv.appr||0.45;D.zoff=mv.zoff;D.sdur=mv.sdur;D.peak=mv.peak;
    if(mvk==='layup'){D.tx=RIM.x+(P.x<250?-14:14);D.ty=RIM.y+34}
    else if(mvk==='reverse'){D.tx=RIM.x+(P.x<250?16:-16);D.ty=RIM.y+22}
    else if(mvk==='euro'){
      const side=Math.sign(stk.x*(-uy)+stk.y*ux)||1;
      D.w1x=clamp(P.x+(-uy*side)*34,20,W-20);D.w1y=clamp(P.y+(ux*side)*34,20,H-10);
      D.tx=RIM.x+(P.x<250?-10:10);D.ty=RIM.y+32;
    }else{
      D.tx=P.x+(RIM.x-P.x)*0.12;D.ty=P.y+(RIM.y-P.y)*0.12;
    }
  }
  P.D=D;P.st=0;
  P.state=mode==='dunk'?'dunk':(mode==='layup'?'layup':'shoot');
  say(label,col);
}
function launchShot(z0,dur,peak,pts,p){
  if(P.pending&&P.pending.block){
    B.mode='loose';B.x=P.x;B.y=P.y-6;B.z=P.z+56;
    const a=Math.atan2(P.y-Df.y,P.x-Df.x);
    B.vx=Math.cos(a)*160+(Math.random()-.5)*60;B.vy=Math.sin(a)*160;B.vz=80;B.lock=0.6;
    S.att++;S.streak=0;say('被蓋火鍋!','#f44');
    Df.state='jump';Df.st=0;Df.bite=false;
    return;
  }
  shot={sx:P.x,sy:P.y,z0,t:0,dur,peak,made:Math.random()<p,pts};
  shot.perfect=!!(P.pending&&P.pending.perfect);
  shot.move=P.pending?P.pending.move:'jump';
  B.mode='shot';S.att++;
}

// ---------- 進球特效 ----------
function burst(x,y,z,n,cols,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28,v=spd*(0.4+Math.random());
    parts.push({x,y,z,vx:Math.cos(a)*v,vy:Math.sin(a)*v*0.6,vz:80+Math.random()*spd*1.2,
      life:0.8+Math.random()*0.6,c:cols[i%cols.length],sz:2+Math.random()*3});
  }
}
function onScore(pts,kind,perfect,mvk){
  const mv=MV[mvk]||MV.jump;
  S.score+=pts;S.made++;S.streak++;S.best=Math.max(S.best,S.streak);
  if(kind==='three')S.threes++;
  if(kind==='dunk')S.dunks++;
  netShake=0.6;scorePop=1;
  let txt='進球!',col='#4f4',cols=['#ffd84a','#ff7a1f','#fff'];
  if(kind==='dunk'){txt=mv.name+'!';col='#c6f';shake=mv.shake||0.4;cols=['#c6f','#ffd84a','#fff','#6cf']}
  else if(kind==='three'){txt='三分球!';col='#ffd84a';shake=0.15}
  else if(mvk!=='jump'&&mvk!=='layup'){txt=mv.name+'!';col='#6ff';shake=0.1}
  else if(perfect){txt='SWISH!';col='#6ff';shake=0.1}
  let sub=`+${pts}`;
  if(S.streak>=3)sub=`🔥 連續 ${S.streak} 進`;
  else if(kind==='three'&&mvk!=='jump')sub=`${mv.name} +${pts}`;
  banner={t:txt,c:col,life:1.4,sub};
  burst(RIM.x,RIM.y,RIMZ,kind==='dunk'?60:36,cols,kind==='dunk'?170:120);
  rings.push({t:0});
  if(kind==='dunk')rings.push({t:-0.15});
}
function updateFx(dt){
  S.time+=dt;
  parts.forEach(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=500*dt;p.life-=dt;
    if(p.z<0){p.z=0;p.vz*=-0.4;p.vx*=0.7;p.vy*=0.7}
  });
  parts=parts.filter(p=>p.life>0);
  rings.forEach(r=>r.t+=dt);rings=rings.filter(r=>r.t<0.7);
  if(banner){banner.life-=dt;if(banner.life<=0)banner=null}
  if(shake>0)shake-=dt;
  if(scorePop>0)scorePop-=dt*1.5;
  if(S.streak>=3&&(B.mode==='shot'||(B.mode==='loose'&&B.z>5))){
    parts.push({x:B.x,y:B.y,z:B.z,vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*20,vz:40,
      life:0.35,c:Math.random()<0.5?'#ff7a1f':'#ffd84a',sz:3+Math.random()*3});
  }
}
function drawFx(){
  rings.forEach(r=>{
    if(r.t<0)return;
    const k=r.t/0.7,c=pr(RIM.x,RIM.y,RIMZ),rad=(14+k*70)*c.s*0.94;
    ctx.strokeStyle=`rgba(255,220,90,${1-k})`;ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(c.x,c.y,rad,rad*0.45,0,0,Math.PI*2);ctx.stroke();
  });
  parts.forEach(p=>{
    const q=pr(p.x,p.y,p.z);
    ctx.globalAlpha=Math.min(1,p.life/0.4);ctx.fillStyle=p.c;
    ctx.fillRect(q.x-p.sz*q.s/2,q.y-p.sz*q.s/2,p.sz*q.s,p.sz*q.s);
  });
  ctx.globalAlpha=1;
}
function drawBanner(){
  if(!banner)return;

// ---------- 防守 AI ----------
function updateDef(dt){
  if(!defOn)return;
  const D=Df;
  if(D.stun>0)D.stun-=dt;
  if(D.cool>0)D.cool-=dt;
  if(D.state==='jump'){
    D.st+=dt;D.z=Math.sin(Math.min(1,D.st/0.55)*Math.PI)*24;
    D.vx*=0.9;D.vy*=0.9;
    D.x=clamp(D.x+D.vx*dt,12,W-12);D.y=clamp(D.y+D.vy*dt,12,H-6);
    if(D.st>=0.55){D.state='guard';D.z=0;D.stun=D.bite?0.9:0.15;D.bite=false}
    return;
  }
  const dx=RIM.x-P.x,dy=RIM.y-P.y,dd=Math.hypot(dx,dy)||1;
  const gap=P.state==='aim'?24:36;
  const tx=P.x+dx/dd*gap,ty=P.y+dy/dd*gap;
  const ex=tx-D.x,ey=ty-D.y,ed=Math.hypot(ex,ey);
  const sp=(P.state==='free'?125:110)*(D.stun>0?0.25:1);
  const v=Math.min(sp,ed*6);
  const ux=ed>0.5?ex/ed:0,uy=ed>0.5?ey/ed:0;
  D.vx+=(ux*v-D.vx)*Math.min(1,dt*8);D.vy+=(uy*v-D.vy)*Math.min(1,dt*8);
  D.x=clamp(D.x+D.vx*dt,12,W-12);D.y=clamp(D.y+D.vy*dt,12,H-6);

  const pd=dist(P.x,P.y,D.x,D.y);
  if(pd<18&&pd>0.1&&P.state!=='dunk'&&P.state!=='layup'){
    const push=(18-pd)*0.5,nx=(D.x-P.x)/pd,ny=(D.y-P.y)/pd;
    D.x+=nx*push;D.y+=ny*push;
    P.x=clamp(P.x-nx*push,12,W-12);P.y=clamp(P.y-ny*push,12,H-6);
  }
  if(P.state==='aim'){
    if(!D.react&&meter>D.rt&&pd<85&&D.stun<=0){
      D.react=true;
      if(Math.random()<0.75){D.state='jump';D.st=0;D.bite=false}
    }
  }else D.react=false;

  if(P.state==='free'&&B.mode==='held'&&pd<30&&D.stun<=0&&D.cool<=0&&P.imm<=0){
    D.steal+=dt;
    if(D.steal>=0.6){
      D.steal=0;D.cool=1.5;
      if(Math.random()<0.4){
        B.mode='loose';B.vx=(Math.random()-.5)*220;B.vy=(Math.random()-.5)*220;B.vz=140;B.lock=0.6;
        S.streak=0;say('被抄截!','#f66');
      }
    }
  }else D.steal=Math.max(0,D.steal-dt);
}

// ---------- 更新 ----------
function update(dt){
  time+=dt;
  const k=input.keys;
  let ax=input.jx,ay=input.jy;
  if(k.KeyA||k.ArrowLeft)ax-=1;if(k.KeyD||k.ArrowRight)ax+=1;
  if(k.KeyW||k.ArrowUp)ay-=1;if(k.KeyS||k.ArrowDown)ay+=1;
  let m=Math.hypot(ax,ay);if(m>1){ax/=m;ay/=m;m=1}
  const sprint=(input.sprint||k.KeyL)&&P.stamina>0.02&&m>0.2;
  P.fakeCd=Math.max(0,P.fakeCd-dt);P.imm=Math.max(0,P.imm-dt);

  if(P.state==='free'||P.state==='aim'||P.state==='fake'){
    let sp=sprint?230:150;
    if(P.cross>0){sp*=1.25;P.cross-=dt}
    if(P.state==='aim')sp*=0.15;
    if(P.state==='fake')sp*=0.35;
    P.vx+=(ax*sp-P.vx)*Math.min(1,dt*10);P.vy+=(ay*sp-P.vy)*Math.min(1,dt*10);
    if(m>0.15&&P.state==='free'){P.fx=ax/m;P.fy=ay/m}
    P.x=clamp(P.x+P.vx*dt,12,W-12);P.y=clamp(P.y+P.vy*dt,12,H-6);
    P.stamina=clamp(P.stamina+(sprint?-0.45:0.25)*dt,0,1);
  }
  if(P.state==='fake'){
    P.st+=dt;P.z=Math.sin(Math.min(1,P.st/0.35)*Math.PI)*6;
    if(P.st>=0.35){P.state='free';P.z=0}
  }
  if(P.state==='aim'){
    meter+=dt/0.9;
    P.stk={x:ax,y:ay,m};
    P.move=pickMove(P.mode,ax,ay,m);
    if(meter>=1){meter=1;releaseShot()}
  }
  if(P.state==='shoot'){
    P.st+=dt;const D=P.D;
    P.z=Math.sin(Math.min(1,P.st/D.total)*Math.PI)*D.amp;
    if(D.disp&&P.st<D.rel+0.15){
      const sp=D.disp/(D.rel+0.15);
      P.x=clamp(P.x+D.dx*sp*dt,12,W-12);P.y=clamp(P.y+D.dy*sp*dt,12,H-6);
    }
    if(D.spin)D.angle=Math.min(1,P.st/D.rel)*Math.PI*2;
    if(P.st>=D.rel&&B.mode==='held'){
      const q=P.pending,dL=dist(P.x,P.y,RIM.x,RIM.y);
      const three=dL>THREE_R||Math.abs(P.x-250)>220;
      launchShot(P.z+(q.move==='fade'?60:56),0.7+dL/900,45+dL*0.25,three?3:2,q.p);
    }
    if(P.st>=D.total){P.state='free';P.z=0;P.vx=P.vy=0;P.D=null}
  }
  if(P.state==='layup'){
    P.st+=dt;const D=P.D,t=P.st,mvk=D.move;
    if(mvk==='euro'){
      if(t<0.22){const kk=t/0.22;P.x=D.x0+(D.w1x-D.x0)*kk;P.y=D.y0+(D.w1y-D.y0)*kk}
      else{const kk=Math.min(1,(t-0.22)/0.33);P.x=D.w1x+(D.tx-D.w1x)*kk;P.y=D.w1y+(D.ty-D.w1y)*kk}
    }else{
      const k2=Math.min(1,t/D.appr);
      P.x=D.x0+(D.tx-D.x0)*k2;P.y=D.y0+(D.ty-D.y0)*k2;
    }
    P.z=Math.sin(Math.min(1,t/D.total)*Math.PI)*D.amp+(mvk==='euro'&&t<0.22?Math.sin(t/0.22*Math.PI)*8:0);
    if(t>=D.rel&&B.mode==='held')launchShot(P.z+D.zoff,D.sdur,D.peak,2,P.pending.p);
    if(t>=D.total){P.state='free';P.z=0;P.D=null;P.vx=P.vy=0}
  }
  if(P.state==='dunk'){
    P.st+=dt;const D=P.D,t=P.st,k2=Math.min(1,t/(D.rel-0.05));
    P.x=D.x0+(RIM.x-D.x0)*k2;P.y=D.y0+(RIM.y+18-D.y0)*k2;
    P.z=Math.sin(Math.min(1,t/D.total)*Math.PI)*D.amp;
    if(D.spin)D.angle=Math.min(1,t/D.rel)*Math.PI*2;
    if(t>=D.rel&&!D.done){
      D.done=true;S.att++;
      if(D.ok){
        onScore(2,'dunk',true,D.move);
        Object.assign(B,{mode:'loose',x:RIM.x,y:RIM.y,z:RIMZ+4,vx:0,vy:10,vz:-150});
      }else{
        S.streak=0;say('扣框!','#f66',RIM.x,RIM.y,125);netShake=0.3;
        Object.assign(B,{mode:'loose',x:RIM.x,y:RIM.y,z:RIMZ+10,vx:(Math.random()-.5)*100,vy:60+Math.random()*80,vz:200});
      }
    }
    if(t>=D.total){P.state='free';P.z=0;P.D=null;P.vx=P.vy=0}
  }

  updateDef(dt);

  // 球
  if(B.mode==='held'){
    const bounce=Math.abs(Math.sin(time*(8+Math.hypot(P.vx,P.vy)/25)));
    if(P.state==='free'){B.x=P.x+P.hand*12;B.y=P.y+3;B.z=6+bounce*20}
    else if(P.state==='aim'||P.state==='shoot'){B.x=P.x;B.y=P.y-3;B.z=P.z+54}
    else if(P.state==='fake'){B.x=P.x;B.y=P.y-3;B.z=P.z+36+18*Math.sin(Math.min(1,P.st/0.35)*Math.PI)}
    else if(P.state==='layup'){B.x=P.x+8;B.y=P.y-3;B.z=P.z+56}
    else if(P.state==='dunk'){
      const D=P.D,kk=Math.min(1,P.st/D.rel);
      if(D.move==='wind'){const ang=kk*Math.PI*2.5;B.x=P.x+Math.cos(ang)*18;B.y=P.y-4;B.z=P.z+46+Math.sin(ang)*26}
      else if(D.move==='dunk2'){B.x=P.x;B.y=P.y-4;B.z=P.z+68}
      else{B.x=P.x;B.y=P.y-4;B.z=P.z+60}
    }
  }else if(B.mode==='shot'){
    shot.t+=dt/shot.dur;const t=Math.min(1,shot.t);
    B.x=shot.sx+(RIM.x-shot.sx)*t;B.y=shot.sy+(RIM.y-shot.sy)*t;
    B.z=shot.z0+(RIMZ-shot.z0)*t+shot.peak*4*t*(1-t);
    if(shot.t>=1){
      if(shot.made){
        onScore(shot.pts,shot.pts===3?'three':'normal',shot.perfect,shot.move);
        Object.assign(B,{mode:'loose',x:RIM.x,y:RIM.y,z:RIMZ,vx:(Math.random()-.5)*20,vy:20,vz:-100});
      }else{
        S.streak=0;say('沒進','#f66',RIM.x,RIM.y,110);
        Object.assign(B,{mode:'loose',x:RIM.x,y:RIM.y,z:RIMZ,vx:(Math.random()-.5)*140,vy:60+Math.random()*90,vz:180});
      }
      shot=null;
    }
  }else if(B.mode==='pass'){
    pass.t+=dt/0.5;const t=Math.min(1,pass.t);
    const tx=P.x+P.hand*12,ty=P.y+3;
    B.x=pass.sx+(tx-pass.sx)*t;B.y=pass.sy+(ty-pass.sy)*t;
    B.z=pass.sz+(14-pass.sz)*t+25*4*t*(1-t);
    if(pass.t>=1){
      if(P.state==='free'||P.state==='aim'){B.mode='held'}
      else{B.mode='loose';B.vx=B.vy=B.vz=0}
      pass=null;
    }
  }else if(B.mode==='loose'){
    if(B.lock>0)B.lock-=dt;
    B.x+=B.vx*dt;B.y+=B.vy*dt;B.z+=B.vz*dt;B.vz-=G*dt;
    if(B.z<=0){B.z=0;B.vz=-B.vz*0.55;if(Math.abs(B.vz)<45)B.vz=0;B.vx*=0.9;B.vy*=0.9}
    if(B.z===0){const f=Math.max(0,1-1.2*dt);B.vx*=f;B.vy*=f}
    if(B.x<5||B.x>W-5){B.vx*=-0.7;B.x=clamp(B.x,5,W-5)}
    if(B.y<5||B.y>H-5){B.vy*=-0.7;B.y=clamp(B.y,5,H-5)}
    if(P.state==='free'&&B.lock<=0&&B.z<26&&dist(P.x,P.y,B.x,B.y)<24){B.mode='held';say('撿到球','#ddd')}
  }
  if(netShake>0)netShake-=dt;
  texts.forEach(t=>{t.life-=dt;t.z+=30*dt});texts=texts.filter(t=>t.life>0);
  updateFx(dt);
  updateShootLabel();
}

let lastLabel='';

  let name='投籃';
  if(P.state==='aim'||P.state==='shoot'||P.state==='layup'||P.state==='dunk')name=modeLabel();
  else if(B.mode==='held')name=MODE_NAME[modeByDist(dist(P.x,P.y,RIM.x,RIM.y))];

// ---------- 繪圖 ----------
function path(pts,close){
  ctx.beginPath();
  pts.forEach((p,i)=>{const q=pr(p[0],p[1]);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});
  if(close)ctx.closePath();
}
function arcPts(cx,cy,r,a0,a1,n=48){
  const a=[];for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n;a.push([cx+r*Math.cos(t),cy+r*Math.sin(t)])}return a;
}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}

function drawBackdrop(){
  ctx.fillStyle='#14161f';ctx.fillRect(-20,-20,540,560);
  const far=pr(250,0).y;
  const gr=ctx.createLinearGradient(0,40,0,far);
  gr.addColorStop(0,'#232a44');gr.addColorStop(1,'#10131f');
  ctx.fillStyle=gr;ctx.fillRect(0,40,500,far-40);
  for(let r=0;r<5;r++)for(let c=0;c<42;c++){
    const h=Math.sin(c*12.9+r*78.2)*43758.5;const v=h-Math.floor(h);
    ctx.fillStyle=`hsl(${Math.floor(v*360)},40%,${30+v*20}%)`;
    ctx.beginPath();ctx.arc(6+c*12+(r%2)*6,far-14-r*14,4,0,7);ctx.fill();
  }
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,far-6,500,6);
}

function line3(a,b,col,w){

let SKIN='#f1c9a0';
function arm(x1,y1,x2,y2,s){

function drawPerson(o,def){

    }
  }
  ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(X,Y-46*s,6.5*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(X,Y-46*s,6.5*s,Math.PI,Math.PI*2);ctx.fill();
  if(spun)ctx.restore();
}
function drawBall(){
  const g=pr(B.x,B.y,0),b=pr(B.x,B.y,B.z),r=7*b.s;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(g.x,g.y,r,r*0.4,0,0,7);ctx.fill();
  ctx.fillStyle='#f28a1e';ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.fill();
  ctx.strokeStyle='#4a2200';ctx.lineWidth=1;ctx.beginPath();
  ctx.arc(b.x,b.y,r,0,7);ctx.moveTo(b.x-r,b.y);ctx.lineTo(b.x+r,b.y);ctx.moveTo(b.x,b.y-r);ctx.lineTo(b.x,b.y+r);ctx.stroke();
}
function drawMeter(){
  const show=P.state==='aim'||((P.state==='shoot'||P.state==='layup'||P.state==='dunk')&&P.st<0.5);
  if(!show)return;
  const g=greenInfo(),m=pr(P.x,P.y,P.z),bh=80,bw=12;
  let bx=m.x+30;if(bx>W-24)bx=m.x-42;
  let by=Math.max(48,m.y-60*m.s-bh-10);
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(bx-2,by-2,bw+4,bh+4);
  ctx.fillStyle='#333';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#2e2';ctx.fillRect(bx,by+bh*(1-(g.c+g.w/2)),bw,bh*g.w);
  ctx.fillStyle='#fc3';ctx.fillRect(bx,by+bh*(1-meter),bw,bh*meter);
  ctx.fillStyle='#fff';ctx.fillRect(bx-3,by+bh*(1-meter)-1,bw+6,3);
  ctx.font='bold 12px sans-serif';ctx.textAlign='center';
  ctx.lineWidth=3;ctx.strokeStyle='#000';
  ctx.strokeText(modeLabel(),bx+bw/2,by-6);ctx.fillStyle='#fff';ctx.fillText(modeLabel(),bx+bw/2,by-6);
}
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,40);
  ctx.fillStyle='#ffd84a';ctx.fillRect(0,38,W,2);
  ctx.textAlign='left';ctx.fillStyle='#aaa';ctx.font='11px sans-serif';ctx.fillText('得分',10,14);
  const sc=1+Math.max(0,scorePop)*0.5;
  ctx.save();ctx.translate(10,35);ctx.scale(sc,sc);
  ctx.fillStyle=scorePop>0?'#ffd84a':'#fff';ctx.font='bold 26px sans-serif';ctx.fillText(S.score,0,0);ctx.restore();
  ctx.fillStyle='#fff';ctx.font='12px sans-serif';
  const pct=S.att?Math.round(S.made/S.att*100):0;
  ctx.fillText(`命中 ${S.made}/${S.att}  ${pct}%`,95,16);
  ctx.fillText(`三分 ${S.threes}   灌籃 ${S.dunks}`,95,33);
  ctx.fillText(`連續 ${S.streak}${S.streak>=3?' 🔥':''}   最佳 ${S.best}`,250,16);
  const mm=Math.floor(S.time/60),ss=Math.floor(S.time%60);
  ctx.fillText(`時間 ${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`,250,33);
  ctx.fillStyle='#444';ctx.fillRect(385,10,105,9);
  ctx.fillStyle=P.stamina>0.25?'#3cf':'#f55';ctx.fillRect(385,10,105*P.stamina,9);
  ctx.fillStyle='#aaa';ctx.font='11px sans-serif';ctx.fillText('體力',385,33);
  if(P.state==='aim'){
    ctx.textAlign='center';ctx.font='12px sans-serif';
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(40,44,420,20);
    ctx.fillStyle='#ffd84a';ctx.fillText('拖曳搖桿換動作: '+HINT[P.mode],250,58);
  }
}
function drawTexts(){
  ctx.textAlign='center';ctx.font='bold 18px sans-serif';
  texts.forEach(t=>{
    const q=pr(t.x,t.y,t.z);
    ctx.globalAlpha=Math.min(1,t.life*2);ctx.lineWidth=3;ctx.strokeStyle='#000';
    ctx.strokeText(t.t,q.x,q.y);ctx.fillStyle=t.c;ctx.fillText(t.t,q.x,q.y);
  });
  ctx.globalAlpha=1;
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*14,(Math.random()-.5)*shake*14);
  drawBackdrop();drawCourt();drawHoopBack();
  const items=[
    {y:P.y,f:()=>drawPerson(P,false)},
    {y:B.mode==='held'&&P.state==='free'?P.y+1:B.y,f:drawBall}
  ];
  if(defOn)items.push({y:Df.y,f:()=>drawPerson(Df,true)});
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
  drawHoopFront();drawFx();drawMeter();drawTexts();
  ctx.restore();
  drawHUD();drawBanner();
}

let last=performance.now();
function loop(n){
  const dt=Math.min(0.04,(n-last)/1000);last=n;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// ---------- 玩法說明小視窗 ----------
(function(){

  const tbl=(rows)=>'<table><tr><th>搖桿方向</th><th>動作</th><th>特色</th></tr>'+
    rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')+'</table>';
  const TABS=[
    {id:'basic',name:'基本',html:
      '<p>籃框在畫面上方,所以「朝籃框」是搖桿往上推,「遠離」是往下拉。</p>'+
      '<p><b>移動:</b>左下搖桿(電腦 WASD / 方向鍵)</p>'+
      '<p><b>投籃鍵:</b>按住出手,抓綠色區間放開。離籃框越近,會自動變成上籃或灌籃。</p>'+
      '<p><b>加速:</b>按住跑更快,會消耗體力(電腦 L)</p>'+

      '<p><b>要球:</b>球在地上時,按一下球會飛回手上(電腦 E)</p>'+
      '<p><b>假動作:</b>按紫色鈕,或快速點一下投籃鍵(電腦 F)</p>'+

    {id:'jump',name:'跳投',html:'<p>離籃框遠時使用。</p>'+tbl([
      ['不推','投籃','標準跳投'],
      ['往下拉(遠離)','後仰','往後飄,不易被干擾和蓋火鍋'],
      ['斜後方','後撤步','拉開空間,有機會晃開防守'],
      ['左右橫向','側移跳投','往旁邊移動後出手'],
      ['往上推(朝籃框)','轉身投籃','轉一圈再出手,綠區最窄']])},
    {id:'layup',name:'上籃',html:'<p>離籃框中等距離時使用。</p>'+tbl([
      ['不推或朝籃框','上籃','標準上籃'],
      ['斜向','反手上籃','從籃框另一側出手,有機會晃開防守'],
      ['橫向','歐洲步','先橫移一步再上籃,有機會晃開防守'],
      ['遠離','拋投','高弧線,幾乎不會被蓋火鍋']])},
    {id:'dunk',name:'灌籃',html:'<p>離籃框很近時使用。</p>'+tbl([
      ['不推','單手灌籃','標準灌籃'],
      ['朝籃框','雙手灌籃','畫面震動更大'],
      ['橫向','風車灌籃','球會繞著身體轉一圈'],
      ['遠離','360 灌籃','人會轉一圈,綠區最窄,震動最大']])+
      '<p>越花俏的動作,綠區越窄,命中率也略低。</p>'},
    {id:'def',name:'防守',html:
      '<p><b>防守者(藍色 5 號):</b>會貼著你防守,你出手時會跳起來干擾,也會嘗試抄球。</p>'+
      '<p><b>被干擾:</b>防守者離你越近、擋在你和籃框之間,命中率越低,還可能被蓋火鍋。</p>'+
      '<p><b>假動作:</b>防守者可能被騙跳起來,落地後會站不穩,這時出手最安全。</p>'+
      '<p><b>換手運球:</b>換手後短時間內不會被抄球。</p>'+
      '<p>右上角「防守:開/關」可切換自由練習。</p>'}
  ];
  let cur='basic';
  function render(){
    tabsEl.innerHTML=TABS.map(t=>`<div class="tab${t.id===cur?' act':''}" data-id="${t.id}">${t.name}</div>`).join('');
    content.innerHTML=TABS.find(t=>t.id===cur).html;
  }
  tabsEl.addEventListener('click',e=>{
    const id=e.target.getAttribute('data-id');
    if(id){cur=id;render()}
  });
  function setMin(min){
    help.classList.toggle('min',min);
    arrow.textContent=min?'▶ 展開':'▼ 收起';
    try{localStorage.setItem('helpMin',min?'1':'0')}catch(e){}
  }
  head.addEventListener('click',()=>setMin(!help.classList.contains('min')));
  let saved=null;try{saved=localStorage.getItem('helpMin')}catch(e){}
  render();
  setMin(saved==='1');
})();
</script>
