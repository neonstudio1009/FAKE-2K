<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>線上 1v1</title>
<link rel="icon" type="image/svg+xml" href="street-hoops-logo.svg">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:"Microsoft JhengHei",sans-serif}
  #game{position:fixed;inset:0;width:100vw;height:100dvh;object-fit:contain;display:block}
  #joy{position:fixed;left:5vmin;bottom:5vmin;width:30vmin;height:30vmin;max-width:150px;max-height:150px;min-width:110px;min-height:110px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4)}
  #knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(255,255,255,.6)}
  #pad{position:fixed;right:2vmin;bottom:3vmin;width:230px;height:230px;pointer-events:none}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.6);text-align:center;font-size:15px;line-height:1.1}
  .btn.on{filter:brightness(1.6);transform:scale(.94)}
  #bShoot{right:0;bottom:0;width:96px;height:96px;background:rgba(230,80,40,.85);font-size:20px}
  #bSprint{right:131px;bottom:16px;width:64px;height:64px;background:rgba(40,130,220,.85)}
  #bSec{right:99px;bottom:99px;width:62px;height:62px;background:rgba(150,70,200,.9);font-size:14px}
  #bCross{right:16px;bottom:131px;width:64px;height:64px;background:rgba(30,160,100,.85)}
  .tbtn{position:fixed;right:8px;top:8px;padding:6px 10px;background:rgba(0,0,0,.5);color:#fff;border:1px solid #888;border-radius:8px;font-size:13px;text-decoration:none;z-index:5}
  .ov{position:fixed;inset:0;background:rgba(8,10,20,.94);display:flex;align-items:center;justify-content:center;z-index:20;color:#fff;touch-action:auto}
  .card{width:min(340px,90vw);background:#1b2036;border:2px solid #ffd84a;border-radius:16px;padding:20px;text-align:center}
  .card h2{margin:0 0 12px;color:#ffd84a}
  .card input{width:100%;padding:10px;border-radius:8px;border:1px solid #666;background:#0e1120;color:#fff;font-size:16px;text-align:center;margin-bottom:10px;user-select:text;-webkit-user-select:text}
  .card button,.card a.b{display:block;width:100%;padding:11px;border-radius:10px;border:0;background:#d8362b;color:#fff;font-size:16px;font-weight:bold;margin:6px 0;text-decoration:none;cursor:pointer}
  .card button.b2{background:#2a5bd7}
  .card a.b{background:#444;font-size:14px}
  #status{min-height:22px;margin-top:8px;font-size:14px;color:#9cf}
  #roomBox{font-size:15px;line-height:1.8;margin-top:8px}
  #roomBox b{font-size:34px;letter-spacing:6px;color:#ffd84a}
  #over{display:none;z-index:15;background:rgba(8,10,20,.8)}
</style>
</head>
<body>
<canvas id="game" width="500" height="520"></canvas>
<div id="joy"><div id="knob"></div></div>
<div id="pad">
  <div class="btn" id="bShoot">投籃<br>(按住)</div>
  <div class="btn" id="bSprint">加速</div>
  <div class="btn" id="bSec">假動作</div>
  <div class="btn" id="bCross">換手<br>運球</div>
</div>
<a class="tbtn" href="index.html">回大廳</a>

<div class="ov" id="menu">
  <div class="card">
    <h2>🌐 線上 1v1</h2>
    <input id="nick" maxlength="8" placeholder="你的暱稱">
    <button id="bCreate">建立房間</button>
    <div id="roomBox"></div>
    <hr style="border-color:#334;margin:12px 0">
    <input id="codeIn" inputmode="numeric" maxlength="4" placeholder="輸入 4 位數房號">
    <button class="b2" id="bJoin">加入房間</button>
    <div id="status"></div>
    <a class="b" href="index.html">回大廳</a>
  </div>
</div>
<div class="ov" id="over">
  <div class="card">
    <h2 id="overTitle"></h2>
    <div id="overText" style="margin-bottom:10px"></div>
    <button id="bRe">再來一局</button>
    <a class="b" href="index.html">回大廳</a>
  </div>
</div>

<script>
// ★ 只要改這一行:換成你的 Render 網址(結尾不要加 /)
const SERVER='https://fake-2k.onrender.com';
const WS_URL=SERVER.replace(/^http/,'ws')+'/ws';
fetch(SERVER+'/health',{mode:'no-cors'}).catch(()=>{});

const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const W=500,H=470,RIM={x:250,y:64},RIMZ=66,G=900,THREE_R=237;
const CAM_C=700,CAM_NEAR=480,CAM_Q=700;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function pr(x,y,z=0){const s=CAM_C/(H+CAM_C-y);return {x:250+(x-250)*s*0.94,y:CAM_NEAR-(1-s)*CAM_Q-z*s,s}}

const MV={
  jump:{name:'投籃',w:0,cf:.55,pm:1,bk:1,rel:.25,total:.6,amp:22,disp:0},
  fade:{name:'後仰',w:-.03,cf:.3,pm:.92,bk:.4,rel:.28,total:.65,amp:26,disp:40},
  step:{name:'後撤步',w:-.03,cf:.25,pm:.94,bk:.3,rel:.3,total:.65,amp:24,disp:44},
  side:{name:'側移跳投',w:-.015,cf:.4,pm:.96,bk:.6,rel:.27,total:.62,amp:22,disp:50},
  turn:{name:'轉身投籃',w:-.04,cf:.2,pm:.9,bk:.4,rel:.42,total:.75,amp:24,disp:0,spin:true},
  layup:{name:'上籃',w:.2,cf:.55,pm:1,bk:1,rel:.3,total:.7,amp:34,appr:.45,zoff:56,sdur:.5,peak:16},
  reverse:{name:'反手上籃',w:.2,cf:.45,pm:1,bk:.6,rel:.36,total:.75,amp:34,appr:.5,zoff:56,sdur:.5,peak:22},
  euro:{name:'歐洲步',w:.18,cf:.3,pm:.97,bk:.5,rel:.46,total:.78,amp:32,zoff:56,sdur:.5,peak:16},
  float:{name:'拋投',w:.16,cf:.3,pm:.92,bk:.2,rel:.3,total:.7,amp:30,appr:.3,zoff:62,sdur:.8,peak:55},
  dunk1:{name:'單手灌籃',w:.24,cf:.25,pm:1,bk:0,rel:.7,total:.95,amp:55,shake:.4},
  dunk2:{name:'雙手灌籃',w:.22,cf:.25,pm:1,bk:0,rel:.7,total:.95,amp:58,shake:.5},
  wind:{name:'風車灌籃',w:.18,cf:.25,pm:.95,bk:0,rel:.78,total:1.02,amp:62,shake:.6},
  spin:{name:'360灌籃',w:.15,cf:.25,pm:.9,bk:0,rel:.78,total:1.02,amp:62,shake:.7,spin:true}
};
const HINT={jump:'朝籃框=轉身 橫向=側移 斜後=後撤步 遠離=後仰',layup:'朝籃框=上籃 斜向=反手 橫向=歐洲步 遠離=拋投',dunk:'不推=單手 朝籃框=雙手 橫向=風車 遠離=360'};
const MODE_NAME={jump:'投籃',layup:'上籃',dunk:'灌籃'};
const TEAM=[{c:'#d8362b',sh:'#222',num:'23',skin:'#f1c9a0'},{c:'#2a5bd7',sh:'#112',num:'5',skin:'#c68b5c'}];

const mk=i=>({i,x:250,y:340,vx:0,vy:0,fx:0,fy:-1,z:0,hand:1,state:'free',st:0,stamina:1,cross:0,D:null,mode:'jump',move:'jump',stk:{x:0,y:0,m:0},pending:null,fakeCd:0,imm:0,meter:0,stun:0,jt:0,stealCd:0,bite:false,ang:null,hasSnap:false,tx:250,ty:340,tz:0});
const PL=[mk(0),mk(1)];
const B={x:250,y:340,z:0,vx:0,vy:0,vz:0,mode:'held',owner:0,lock:0,tx:250,ty:340,tz:0,hasSnap:false};
let shot=null;
const G2={score:[0,0],phase:'wait',off:0,timer:0,win:-1,target:11,next:0};
let names=['房主','挑戰者'],role=null,ws=null,started=false,dead=false;
let parts=[],rings=[],banner=null,shake=0,scorePop=[0,0],texts=[],netShake=0,time=0;
const ZERO={ax:0,ay:0,sprint:false};
const inp=[{ax:0,ay:0,sprint:false},{ax:0,ay:0,sprint:false}];
const ctl={jx:0,jy:0,sprint:false,keys:{}};
const me=()=>role==='guest'?1:0;
const holder=p=>B.mode==='held'&&B.owner===p.i;
function readLocal(){
  const k=ctl.keys;let ax=ctl.jx,ay=ctl.jy;
  if(k.KeyA||k.ArrowLeft)ax-=1;if(k.KeyD||k.ArrowRight)ax+=1;
  if(k.KeyW||k.ArrowUp)ay-=1;if(k.KeyS||k.ArrowDown)ay+=1;
  return {ax,ay,sprint:!!(ctl.sprint||k.KeyL)};
}

// ---------- 事件與特效 ----------
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function emit(e){handleEv(e);if(role==='host')send({t:'ev',e})}
function sayAt(p,t,c,zo=75){emit({k:'say',t,c:c||'#fff',x:p.x,y:p.y,z:(p.z||0)+zo})}
function handleEv(e){
  if(e.k==='say')texts.push({t:e.t,c:e.c,x:e.x,y:e.y,z:e.z,life:1.1});
  else if(e.k==='score')scoreFx(e);
}
function burst(x,y,z,n,cols,spd){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=spd*(0.4+Math.random());
    parts.push({x,y,z,vx:Math.cos(a)*v,vy:Math.sin(a)*v*0.6,vz:80+Math.random()*spd*1.2,life:0.8+Math.random()*0.6,c:cols[i%cols.length],sz:2+Math.random()*3})}
}
function scoreFx(e){
  const mv=MV[e.mv]||MV.jump;
  scorePop[e.who]=1;netShake=0.6;
  let txt='進球!',col='#4f4',cols=['#ffd84a','#ff7a1f','#fff'];
  if(e.kind==='dunk'){txt=mv.name+'!';col='#c6f';shake=mv.shake||0.4;cols=['#c6f','#ffd84a','#fff','#6cf']}
  else if(e.kind==='three'){txt='三分球!';col='#ffd84a';shake=0.15}
  else if(e.mv!=='jump'&&e.mv!=='layup'){txt=mv.name+'!';col='#6ff';shake=0.1}
  else if(e.perfect){txt='SWISH!';col='#6ff';shake=0.1}
  banner={t:txt,c:col,life:1.4,sub:`${names[e.who]} +${e.pts}`};
  burst(RIM.x,RIM.y,RIMZ,e.kind==='dunk'?60:36,cols,e.kind==='dunk'?170:120);
  rings.push({t:0});if(e.kind==='dunk')rings.push({t:-0.15});
}
function updateFx(dt){
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=500*dt;p.life-=dt;if(p.z<0){p.z=0;p.vz*=-0.4;p.vx*=0.7;p.vy*=0.7}});
  parts=parts.filter(p=>p.life>0);
  rings.forEach(r=>r.t+=dt);rings=rings.filter(r=>r.t<0.7);
  if(banner){banner.life-=dt;if(banner.life<=0)banner=null}
  if(shake>0)shake-=dt;
  scorePop[0]=Math.max(0,scorePop[0]-dt*1.5);scorePop[1]=Math.max(0,scorePop[1]-dt*1.5);
  if(netShake>0)netShake-=dt;
  texts.forEach(t=>{t.life-=dt;t.z+=30*dt});texts=texts.filter(t=>t.life>0);
}

// ---------- 比賽邏輯(只有房主執行) ----------
function modeByDist(d){return d<=85?'dunk':(d<=130?'layup':'jump')}
function defaultMove(m){return m==='jump'?'jump':(m==='layup'?'layup':'dunk1')}
function pickMove(p,mode,ax,ay,m){
  if(m<0.5)return defaultMove(mode);
  const dd=Math.hypot(p.x-RIM.x,p.y-RIM.y)||1,ux=(p.x-RIM.x)/dd,uy=(p.y-RIM.y)/dd;
  const th=Math.acos(clamp((ax*ux+ay*uy)/m,-1,1))*180/Math.PI,ph=180-th;
  if(mode==='jump')return th<35?'fade':(th<80?'step':(th<130?'side':'turn'));
  if(mode==='layup')return ph<35?'layup':(ph<80?'reverse':(ph<125?'euro':'float'));
  return ph<40?'dunk2':(ph<120?'wind':'spin');
}
function greenInfo(p){
  const d=dist(p.x,p.y,RIM.x,RIM.y),mv=MV[p.move]||MV.jump;
  if(p.mode==='jump')return {c:0.82,w:clamp(0.22-d*0.0006+mv.w,0.04,0.2),d};
  return {c:0.82,w:mv.w,d};
}
function contest(p){
  const o=PL[1-p.i],vx=o.x-p.x,vy=o.y-p.y,d=Math.hypot(vx,vy);
  let c=clamp(1-d/70,0,1);
  const rx=RIM.x-p.x,ry=RIM.y-p.y,rl=Math.hypot(rx,ry)||1;
  if((vx*rx+vy*ry)/((d||1)*rl)<0.3)c*=0.5;
  if(c>0&&o.state==='block'&&o.z>6)c=Math.min(1,c+0.35);
  if(o.stun>0)c*=0.2;
  return c;
}
function doAct(i,b){
  if(G2.phase!=='play')return;
  const p=PL[i];
  if(b==='sd')startAim(p);
  else if(b==='su')releaseShot(p);
  else if(b==='sec')holder(p)?pumpFake(p):stealTry(p);
  else if(b==='cross')crossover(p);
}
function crossover(p){if(p.state==='free'&&holder(p)){p.hand*=-1;p.cross=0.3;p.imm=0.6;sayAt(p,'換手運球','#8ff')}}
function pumpFake(p){
  if(p.state!=='free'||p.fakeCd>0)return;
  p.state='fake';p.st=0;p.fakeCd=0.7;p.imm=0.8;sayAt(p,'假動作!','#c8f');
  const o=PL[1-p.i];
  if(o.state==='block'&&dist(p.x,p.y,o.x,o.y)<110){o.bite=true;sayAt(o,'被騙了!','#4f4',85)}
}
function stealTry(p){
  const o=PL[1-p.i];
  if(p.state!=='free'||p.stealCd>0||p.stun>0)return;
  p.stealCd=1.2;
  if(B.mode==='held'&&B.owner===o.i&&o.state==='free'&&dist(p.x,p.y,o.x,o.y)<36){
    if(Math.random()<(o.imm>0?0.08:0.4)){B.owner=p.i;o.stun=0.5;G2.off=p.i;sayAt(p,'抄截成功!','#4f4')}
    else{p.stun=0.5;sayAt(p,'抄截失敗','#f66')}
  }else p.stun=0.3;
}
function startAim(p){
  if(p.state==='fake'&&holder(p)){p.state='free';p.z=0}
  if(p.state!=='free')return;
  if(!holder(p)){if(p.stun>0||p.jt>0)return;p.state='block';p.st=0;p.jt=0.9;return}
  p.mode=modeByDist(dist(p.x,p.y,RIM.x,RIM.y));p.move=defaultMove(p.mode);p.state='aim';p.meter=0;
}
function releaseShot(p){
  if(p.state!=='aim')return;
  if(p.meter<0.12){p.state='free';pumpFake(p);return}
  const o=PL[1-p.i],mode=p.mode,mvk=p.move,mv=MV[mvk];
  const g=greenInfo(p),err=p.meter-g.c,ae=Math.abs(err),perfect=ae<=g.w/2;
  let pp,label,col;
  if(perfect){pp=mode==='dunk'?1:(mode==='layup'?0.95:0.97);label=mvk==='jump'?'完美出手!':'完美'+mv.name+'!';col='#4f4'}
  else if(ae<=g.w*1.3){pp=mode==='dunk'?0.8:(mode==='layup'?0.65:clamp(0.6-g.d*0.0008,0.2,0.6));label='還不錯';col='#ff4'}
  else{pp=mode==='dunk'?0.1:0.07;label=err<0?'太早了':'太晚了';col='#f66'}
  const dd=g.d,ux=(p.x-RIM.x)/Math.max(1,dd),uy=(p.y-RIM.y)/Math.max(1,dd),stk=p.stk;
  if((mvk==='step'||mvk==='euro'||mvk==='reverse')&&o.state==='free'&&dist(p.x,p.y,o.x,o.y)<60&&Math.random()<0.35){o.stun=Math.max(o.stun,0.5);sayAt(o,'被晃開!','#4f4',85)}
  const c=contest(p);
  if(c>0.4)sayAt(p,'被干擾','#f96',95);
  pp*=(1-mv.cf*c)*mv.pm;
  const block=mode!=='dunk'&&c>0.7&&Math.random()<(c-0.6)*(perfect?0.5:1.2)*mv.bk;
  p.pending={p:pp,mode,perfect,move:mvk,block,d:dd};
  p.fx=-ux;p.fy=-uy;
  const D={x0:p.x,y0:p.y,done:false,ok:Math.random()<pp,move:mvk,spin:!!mv.spin,rel:mv.rel,total:mv.total,amp:mv.amp,disp:mv.disp||0,dx:0,dy:0};
  if(mode==='jump'&&D.disp){if(mvk==='fade'||stk.m<=0.1){D.dx=ux;D.dy=uy}else{D.dx=stk.x/stk.m;D.dy=stk.y/stk.m}}
  if(mode==='layup'){
    D.appr=mv.appr||0.45;D.zoff=mv.zoff;D.sdur=mv.sdur;D.peak=mv.peak;
    if(mvk==='layup'){D.tx=RIM.x+(p.x<250?-14:14);D.ty=RIM.y+34}
    else if(mvk==='reverse'){D.tx=RIM.x+(p.x<250?16:-16);D.ty=RIM.y+22}
    else if(mvk==='euro'){
      const side=Math.sign(stk.x*(-uy)+stk.y*ux)||1;
      D.w1x=clamp(p.x+(-uy*side)*34,20,W-20);D.w1y=clamp(p.y+(ux*side)*34,20,H-10);
      D.tx=RIM.x+(p.x<250?-10:10);D.ty=RIM.y+32;
    }else{D.tx=p.x+(RIM.x-p.x)*0.12;D.ty=p.y+(RIM.y-p.y)*0.12}
  }
  p.D=D;p.st=0;
  p.state=mode==='dunk'?'dunk':(mode==='layup'?'layup':'shoot');
  sayAt(p,label,col);
}
function launchShot(p,z0,dur,peak,pts,pp){
  if(p.pending&&p.pending.block){
    const o=PL[1-p.i];
    B.mode='loose';B.owner=-1;B.x=p.x;B.y=p.y-6;B.z=p.z+56;
    const a=Math.atan2(p.y-o.y,p.x-o.x);
    B.vx=Math.cos(a)*160+(Math.random()-.5)*60;B.vy=Math.sin(a)*160;B.vz=80;B.lock=0.6;
    sayAt(p,'被蓋火鍋!','#f44');return;
  }
  shot={who:p.i,sx:p.x,sy:p.y,z0,t:0,dur,peak,made:Math.random()<pp,pts,perfect:!!(p.pending&&p.pending.perfect),move:p.pending?p.pending.move:'jump'};
  B.mode='shot';B.owner=p.i;
}
function scored(p,pts,kind,perfect,mvk){
  G2.score[p.i]+=pts;
  emit({k:'score',who:p.i,pts,kind,perfect,mv:mvk});
  PL.forEach(q=>{if(q.state==='aim')q.state='free'});
  if(G2.score[p.i]>=G2.target){G2.phase='over';G2.win=p.i}
  else{G2.phase='check';G2.timer=1.9;G2.next=1-p.i}
}
function resetRound(n){
  PL.forEach(p=>Object.assign(p,{vx:0,vy:0,z:0,state:'free',D:null,stamina:1,pending:null,stun:0,bite:false,ang:null,meter:0,imm:0,cross:0}));
  PL[n].x=250;PL[n].y=330;PL[1-n].x=250;PL[1-n].y=250;
  Object.assign(B,{mode:'held',owner:n,z:0,vx:0,vy:0,vz:0,lock:0});
  shot=null;G2.phase='play';G2.off=n;
  sayAt(PL[n],names[n]+' 進攻','#ffd84a',95);
}
function startGame(){G2.score=[0,0];G2.win=-1;resetRound(Math.random()<0.5?0:1)}

function stepPlayer(p,dt,ip){
  let ax=ip.ax,ay=ip.ay,m=Math.hypot(ax,ay);if(m>1){ax/=m;ay/=m;m=1}
  const sprint=ip.sprint&&p.stamina>0.02&&m>0.2;
  p.fakeCd=Math.max(0,p.fakeCd-dt);p.imm=Math.max(0,p.imm-dt);p.stealCd=Math.max(0,p.stealCd-dt);p.jt=Math.max(0,p.jt-dt);
  if(p.stun>0)p.stun-=dt;
  const st=p.state;
  if(st==='free'||st==='aim'||st==='fake'||st==='block'){
    let sp=sprint?230:150;
    if(p.cross>0){sp*=1.25;p.cross-=dt}
    if(st==='aim')sp*=0.15;else if(st==='fake')sp*=0.35;else if(st==='block')sp*=0.4;
    if(p.stun>0)sp*=0.3;
    p.vx+=(ax*sp-p.vx)*Math.min(1,dt*10);p.vy+=(ay*sp-p.vy)*Math.min(1,dt*10);
    if(m>0.15&&st==='free'){p.fx=ax/m;p.fy=ay/m}
    p.x=clamp(p.x+p.vx*dt,12,W-12);p.y=clamp(p.y+p.vy*dt,12,H-6);
    p.stamina=clamp(p.stamina+(sprint?-0.45:0.25)*dt,0,1);
  }
  if(st==='block'){p.st+=dt;p.z=Math.sin(Math.min(1,p.st/0.55)*Math.PI)*24;if(p.st>=0.55){p.state='free';p.z=0;p.stun=p.bite?0.9:0.25;p.bite=false}}
  if(st==='fake'){p.st+=dt;p.z=Math.sin(Math.min(1,p.st/0.35)*Math.PI)*6;if(p.st>=0.35){p.state='free';p.z=0}}
  if(st==='aim'){
    p.meter+=dt/0.9;p.stk={x:ax,y:ay,m};p.move=pickMove(p,p.mode,ax,ay,m);
    if(p.meter>=1){p.meter=1;releaseShot(p)}
  }
  if(p.state==='shoot'){
    p.st+=dt;const D=p.D;
    p.z=Math.sin(Math.min(1,p.st/D.total)*Math.PI)*D.amp;
    if(D.disp&&p.st<D.rel+0.15){const sp=D.disp/(D.rel+0.15);p.x=clamp(p.x+D.dx*sp*dt,12,W-12);p.y=clamp(p.y+D.dy*sp*dt,12,H-6)}
    p.ang=D.spin?Math.min(1,p.st/D.rel)*Math.PI*2:null;
    if(p.st>=D.rel&&holder(p)){
      const q=p.pending,dL=dist(p.x,p.y,RIM.x,RIM.y),three=dL>THREE_R||Math.abs(p.x-250)>220;
      launchShot(p,p.z+(q.move==='fade'?60:56),0.7+dL/900,45+dL*0.25,three?3:2,q.p);
    }
    if(p.st>=D.total){p.state='free';p.z=0;p.vx=p.vy=0;p.D=null;p.ang=null}
  }
  if(p.state==='layup'){
    p.st+=dt;const D=p.D,t=p.st;
    if(D.move==='euro'){
      if(t<0.22){const k=t/0.22;p.x=D.x0+(D.w1x-D.x0)*k;p.y=D.y0+(D.w1y-D.y0)*k}
      else{const k=Math.min(1,(t-0.22)/0.33);p.x=D.w1x+(D.tx-D.w1x)*k;p.y=D.w1y+(D.ty-D.w1y)*k}
    }else{const k=Math.min(1,t/D.appr);p.x=D.x0+(D.tx-D.x0)*k;p.y=D.y0+(D.ty-D.y0)*k}
    p.z=Math.sin(Math.min(1,t/D.total)*Math.PI)*D.amp+(D.move==='euro'&&t<0.22?Math.sin(t/0.22*Math.PI)*8:0);
    if(t>=D.rel&&holder(p))launchShot(p,p.z+D.zoff,D.sdur,D.peak,2,p.pending.p);
    if(t>=D.total){p.state='free';p.z=0;p.D=null;p.vx=p.vy=0}
  }
  if(p.state==='dunk'){
    p.st+=dt;const D=p.D,t=p.st,k=Math.min(1,t/(D.rel-0.05));
    p.x=D.x0+(RIM.x-D.x0)*k;p.y=D.y0+(RIM.y+18-D.y0)*k;
    p.z=Math.sin(Math.min(1,t/D.total)*Math.PI)*D.amp;
    p.ang=D.spin?Math.min(1,t/D.rel)*Math.PI*2:null;
    if(t>=D.rel&&!D.done){
      D.done=true;
      if(D.ok){
        Object.assign(B,{mode:'loose',owner:-1,x:RIM.x,y:RIM.y,z:RIMZ+4,vx:0,vy:10,vz:-150,lock:0});
        scored(p,2,'dunk',true,D.move);
      }else{
        sayAt(p,'扣框!','#f66',90);netShake=0.3;
        Object.assign(B,{mode:'loose',owner:-1,x:RIM.x,y:RIM.y,z:RIMZ+10,vx:(Math.random()-.5)*100,vy:60+Math.random()*80,vz:200,lock:0});
      }
    }
    if(t>=D.total){p.state='free';p.z=0;p.D=null;p.vx=p.vy=0;p.ang=null}
  }
}
function collide(){
  const a=PL[0],b=PL[1],d=dist(a.x,a.y,b.x,b.y),busy=p=>p.state==='dunk'||p.state==='layup';
  if(d<18&&d>0.1&&!busy(a)&&!busy(b)){
    const push=(18-d)*0.5,nx=(b.x-a.x)/d,ny=(b.y-a.y)/d;
    a.x=clamp(a.x-nx*push,12,W-12);a.y=clamp(a.y-ny*push,12,H-6);
    b.x=clamp(b.x+nx*push,12,W-12);b.y=clamp(b.y+ny*push,12,H-6);
  }
}
function heldPos(p){
  const bounce=Math.abs(Math.sin(time*(8+Math.hypot(p.vx,p.vy)/25))),s=p.state;
  if(s==='free'||s==='block'){B.x=p.x+p.hand*12;B.y=p.y+3;B.z=6+bounce*20}
  else if(s==='aim'||s==='shoot'){B.x=p.x;B.y=p.y-3;B.z=p.z+54}
  else if(s==='fake'){B.x=p.x;B.y=p.y-3;B.z=p.z+36+18*Math.sin(Math.min(1,p.st/0.35)*Math.PI)}
  else if(s==='layup'){B.x=p.x+8;B.y=p.y-3;B.z=p.z+56}
  else if(s==='dunk'){
    const D=p.D,k=Math.min(1,p.st/D.rel);
    if(D.move==='wind'){const a=k*Math.PI*2.5;B.x=p.x+Math.cos(a)*18;B.y=p.y-4;B.z=p.z+46+Math.sin(a)*26}
    else if(D.move==='dunk2'){B.x=p.x;B.y=p.y-4;B.z=p.z+68}
    else{B.x=p.x;B.y=p.y-4;B.z=p.z+60}
  }
}
function ballUpdate(dt){
  if(B.mode==='held'){heldPos(PL[B.owner])}
  else if(B.mode==='shot'){
    shot.t+=dt/shot.dur;const t=Math.min(1,shot.t);
    B.x=shot.sx+(RIM.x-shot.sx)*t;B.y=shot.sy+(RIM.y-shot.sy)*t;
    B.z=shot.z0+(RIMZ-shot.z0)*t+shot.peak*4*t*(1-t);
    if(shot.t>=1){
      const sh=shot,p=PL[sh.who];shot=null;
      if(sh.made){
        Object.assign(B,{mode:'loose',owner:-1,x:RIM.x,y:RIM.y,z:RIMZ,vx:(Math.random()-.5)*20,vy:20,vz:-100,lock:0});
        scored(p,sh.pts,sh.pts===3?'three':'normal',sh.perfect,sh.move);
      }else{
        sayAt({x:RIM.x,y:RIM.y,z:0},'沒進','#f66',110);
        Object.assign(B,{mode:'loose',owner:-1,x:RIM.x,y:RIM.y,z:RIMZ,vx:(Math.random()-.5)*140,vy:60+Math.random()*90,vz:180,lock:0});
      }
    }
  }else if(B.mode==='loose'){
    if(B.lock>0)B.lock-=dt;
    B.x+=B.vx*dt;B.y+=B.vy*dt;B.z+=B.vz*dt;B.vz-=G*dt;
    if(B.z<=0){B.z=0;B.vz=-B.vz*0.55;if(Math.abs(B.vz)<45)B.vz=0;B.vx*=0.9;B.vy*=0.9}
    if(B.z===0){const f=Math.max(0,1-1.2*dt);B.vx*=f;B.vy*=f}
    if(B.x<5||B.x>W-5){B.vx*=-0.7;B.x=clamp(B.x,5,W-5)}
    if(B.y<5||B.y>H-5){B.vy*=-0.7;B.y=clamp(B.y,5,H-5)}
    if(G2.phase==='play'&&B.lock<=0&&B.z<26){
      for(const p of PL){if(p.state==='free'&&dist(p.x,p.y,B.x,B.y)<24){B.mode='held';B.owner=p.i;G2.off=p.i;sayAt(p,'撿到球','#ddd');break}}
    }
  }
}
let snapT=0;
function snapshot(){
  const r=v=>Math.round(v*10)/10,r2=v=>Math.round(v*100)/100;
  return {t:'s',
    p:PL.map(p=>[r(p.x),r(p.y),r(p.z),r(p.vx),r(p.vy),p.state,p.move,p.hand,r2(p.meter),r2(p.stamina),p.stun>0?1:0,p.ang==null?null:r2(p.ang),p.mode,r2(p.st)]),
    b:[r(B.x),r(B.y),r(B.z),B.mode,B.owner],sc:G2.score,ph:G2.phase,off:G2.off,tm:r(G2.timer),win:G2.win,nx:G2.next};
}
function hostUpdate(dt){
  time+=dt;inp[0]=readLocal();
  const frozen=G2.phase!=='play';
  PL.forEach(p=>stepPlayer(p,dt,frozen?ZERO:inp[p.i]));
  collide();ballUpdate(dt);
  if(G2.phase==='check'){G2.timer-=dt;if(G2.timer<=0)resetRound(G2.next)}
  snapT+=dt;if(snapT>=0.05){snapT=0;send(snapshot())}
}
function applySnap(d){
  d.p.forEach((a,i)=>{
    const p=PL[i];
    p.tx=a[0];p.ty=a[1];p.tz=a[2];p.vx=a[3];p.vy=a[4];p.state=a[5];p.move=a[6];p.hand=a[7];
    p.meter=a[8];p.stamina=a[9];p.stun=a[10];p.ang=a[11];p.mode=a[12];p.st=a[13];
    if(!p.hasSnap){p.x=p.tx;p.y=p.ty;p.z=p.tz;p.hasSnap=true}
  });
  B.tx=d.b[0];B.ty=d.b[1];B.tz=d.b[2];B.mode=d.b[3];B.owner=d.b[4];
  if(!B.hasSnap){B.x=B.tx;B.y=B.ty;B.z=B.tz;B.hasSnap=true}
  G2.score=d.sc;G2.phase=d.ph;G2.off=d.off;G2.timer=d.tm;G2.win=d.win;G2.next=d.nx;
}
function guestUpdate(dt){
  time+=dt;const k=Math.min(1,dt*20);
  PL.forEach(p=>{p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k;p.z+=(p.tz-p.z)*k});
  B.x+=(B.tx-B.x)*k;B.y+=(B.ty-B.y)*k;B.z+=(B.tz-B.z)*k;
}

const joy=$('joy'),knob=$('knob');let joyId=null;
function joyMove(e){
  const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2;
  let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy);
  if(d>R){dx*=R/d;dy*=R/d}
  ctl.jx=dx/R;ctl.jy=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`;

joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);

// ---------- 連線(Render 伺服器) ----------
const setStatus=t=>$('status').textContent=t;
$('nick').value=(()=>{try{return localStorage.getItem('hoopNick')||''}catch(e){return ''}})();
function myName(){
  const raw=$('nick').value.trim();
  try{localStorage.setItem('hoopNick',raw)}catch(e){}
  return raw||(role==='guest'?'挑戰者':'房主');
}
function connect(onOpen){
  if(ws){ws.onclose=null;ws.close()}
  setStatus('連線伺服器中...(伺服器剛醒來時可能要等約 1 分鐘)');
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{setStatus('');onOpen()};
  ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(x){return}onData(d)};
  ws.onclose=()=>onClose();
  ws.onerror=()=>setStatus('無法連線到伺服器');
}
$('bCreate').addEventListener('click',()=>{role='host';connect(()=>send({t:'create'}))});
$('bJoin').addEventListener('click',()=>{
  const code=$('codeIn').value.trim();
  if(!/^\d{4}$/.test(code)){setStatus('請輸入 4 位數房號');return}
  role='guest';connect(()=>send({t:'join',code}));
});
function onData(d){
  if(!d||typeof d!=='object')return;
  if(d.t==='created'){$('roomBox').innerHTML=`房號 <b>${d.code}</b><br>把房號告訴朋友,等待加入...`}
  else if(d.t==='err'){setStatus(d.msg||'發生錯誤')}
  else if(d.t==='joined'&&role==='guest'){setStatus('已加入,等待房主開始...');send({t:'hi',name:myName()})}
  else if(d.t==='peer_left'){onClose()}
  else if(d.t==='hi'&&role==='host'){
    names[0]=myName();names[1]=String(d.name||'挑戰者').slice(0,8);
    send({t:'start',names});started=true;$('menu').style.display='none';startGame();
  }
  else if(d.t==='start'&&role==='guest'){names=d.names;started=true;$('menu').style.display='none'}
  else if(d.t==='in'&&role==='host'){inp[1]={ax:clamp(+d.ax||0,-1,1),ay:clamp(+d.ay||0,-1,1),sprint:!!d.sprint}}
  else if(d.t==='btn'&&role==='host'){if(['sd','su','sec','cross'].includes(d.b))doAct(1,d.b)}
  else if(d.t==='rematch'&&role==='host'){startGame()}
  else if(d.t==='ev'&&role==='guest'){handleEv(d.e)}
  else if(d.t==='s'&&role==='guest'){applySnap(d)}
}
function onClose(){
  if(!started){setStatus('連線中斷了,請重試');return}
  started=false;dead=true;
  $('over').style.display='flex';$('overTitle').textContent='連線中斷';
  $('overText').textContent='對手離線或伺服器重啟了,請回大廳重新建立房間。';$('bRe').style.display='none';
}
$('bRe').addEventListener('click',()=>{if(role==='host')startGame();else send({t:'rematch'});$('bRe').textContent='等待中...'});
let overShown=false;
function syncOver(){
  if(dead)return;
  const show=started&&G2.phase==='over';
  if(show!==overShown){
    overShown=show;$('over').style.display=show?'flex':'none';
    if(show){
      $('overTitle').textContent=G2.win===me()?'🏆 你贏了!':'你輸了…';
      $('overText').textContent=`${names[0]} ${G2.score[0]} : ${G2.score[1]} ${names[1]}`;
      $('bRe').style.display='block';$('bRe').textContent='再來一局';
    }
  }
}

// ---------- 繪圖 ----------
function path(pts,close){ctx.beginPath();pts.forEach((p,i)=>{const q=pr(p[0],p[1]);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});if(close)ctx.closePath()}
function arcPts(cx,cy,r,a0,a1,n=48){const a=[];for(let i=0;i<=n;i++){const t=a0+(a1-a0)*i/n;a.push([cx+r*Math.cos(t),cy+r*Math.sin(t)])}return a}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function drawBackdrop(){
  ctx.fillStyle='#14161f';ctx.fillRect(-20,-20,540,560);
  const far=pr(250,0).y,gr=ctx.createLinearGradient(0,40,0,far);
  gr.addColorStop(0,'#232a44');gr.addColorStop(1,'#10131f');ctx.fillStyle=gr;ctx.fillRect(0,40,500,far-40);
  for(let r=0;r<5;r++)for(let c=0;c<42;c++){
    const h=Math.sin(c*12.9+r*78.2)*43758.5,v=h-Math.floor(h);
    ctx.fillStyle=`hsl(${Math.floor(v*360)},40%,${30+v*20}%)`;ctx.beginPath();ctx.arc(6+c*12+(r%2)*6,far-14-r*14,4,0,7);ctx.fill();
  }
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,far-6,500,6);
}
function drawCourt(){
  path([[0,0],[W,0],[W,H],[0,H]],true);ctx.fillStyle='#c98f4f';ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.07)';
  for(let x=0;x<W;x+=25)if((x/25)%2){path([[x,0],[x+25,0],[x+25,H],[x,H]],true);ctx.fill()}
  const a=pr(250,0).y,b=pr(250,H).y,gr=ctx.createLinearGradient(0,a,0,b);
  gr.addColorStop(0,'rgba(0,0,0,.28)');gr.addColorStop(1,'rgba(0,0,0,0)');
  path([[0,0],[W,0],[W,H],[0,H]],true);ctx.fillStyle=gr;ctx.fill();
  path([[170,0],[330,0],[330,190],[170,190]],true);ctx.fillStyle='#a8452f';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.lineJoin='round';
  path([[0,0],[W,0],[W,H],[0,H]],true);ctx.stroke();
  path([[170,0],[330,0],[330,190],[170,190]],true);ctx.stroke();
  path(arcPts(250,190,60,0,Math.PI*2),true);ctx.stroke();
  path(arcPts(RIM.x,RIM.y,40,0,Math.PI));ctx.stroke();
  const a1=Math.atan2(88,220),cy=RIM.y+88;
  path([[30,0],[30,cy],...arcPts(RIM.x,RIM.y,THREE_R,Math.PI-a1,a1),[470,cy],[470,0]]);ctx.stroke();
  path(arcPts(250,H,60,Math.PI,Math.PI*2));ctx.stroke();
}
function line3(a,b,col,w){const p=pr(...a),q=pr(...b);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
function ringArc(a0,a1){
  const glow=netShake>0;
  ctx.strokeStyle=glow?'#ffd84a':'#ff5a1f';ctx.lineWidth=glow?5:3.5;ctx.shadowColor='#ffd84a';ctx.shadowBlur=glow?18:0;ctx.beginPath();
  for(let i=0;i<=20;i++){const t=a0+(a1-a0)*i/20,p=pr(RIM.x+14*Math.cos(t),RIM.y+14*Math.sin(t),RIMZ);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}
  ctx.stroke();ctx.shadowBlur=0;
}
function drawHoopBack(){
  line3([250,-14,0],[250,-14,112],'#555',6);line3([250,-14,104],[250,46,104],'#666',4);
  const q=[[215,46,58],[285,46,58],[285,46,105],[215,46,105]].map(p=>pr(...p));

  ctx.fillStyle='rgba(235,242,255,.88)';ctx.fill();ctx.strokeStyle='#9ab';ctx.lineWidth=2;ctx.stroke();
  const r=[[238,46,62],[262,46,62],[262,46,82],[238,46,82]].map(p=>pr(...p));
  ctx.beginPath();r.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();

function drawHoopFront(){

}
let SKIN='#f1c9a0';
function arm(x1,y1,x2,y2,s){ctx.strokeStyle=SKIN;ctx.lineWidth=4*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function drawPerson(p){
  const T=TEAM[p.i];SKIN=T.skin;
  const g=pr(p.x,p.y,0),b=pr(p.x,p.y,p.z),s=b.s,X=b.x,Y=b.y,o=PL[1-p.i];
  ctx.fillStyle='rgba(0,0,0,.32)';ctx.beginPath();ctx.ellipse(g.x,g.y,14*s*(1-p.z/220),5.5*s,0,0,Math.PI*2);ctx.fill();
  let spun=false;
  if(p.ang!=null&&(p.state==='shoot'||p.state==='dunk')){
    let c=Math.cos(p.ang);if(Math.abs(c)<0.2)c=c<0?-0.2:0.2;
    ctx.save();ctx.translate(X,Y);ctx.scale(c,1);ctx.translate(-X,-Y);spun=true;
  }
  const run=Math.min(1,Math.hypot(p.vx,p.vy)/150),sw=Math.sin(time*14+p.i*1.5)*run;
  ctx.lineCap='round';ctx.strokeStyle=SKIN;ctx.lineWidth=5*s;
  [[-1,sw],[1,-sw]].forEach(([d,w])=>{
    const fy=Y-Math.max(0,w)*4*s-(p.z>0?4*s:0);
    ctx.beginPath();ctx.moveTo(X+d*4*s,Y-17*s);ctx.lineTo(X+d*5*s,fy);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(X+d*5*s,fy,4.5*s,2.5*s,0,0,7);ctx.fill();
  });
  ctx.fillStyle=T.sh;ctx.fillRect(X-10*s,Y-25*s,20*s,9*s);
  ctx.fillStyle=T.c;rr(X-10*s,Y-39*s,20*s,17*s,4*s);ctx.fill();
  ctx.fillStyle='#fff';ctx.font=`bold ${10*s}px sans-serif`;ctx.textAlign='center';ctx.fillText(T.num,X,Y-27*s);
  const sh=dx=>[X+dx*s,Y-36*s],held=holder(p),st=p.state;
  if(held&&(st==='aim'||st==='shoot'||st==='fake'||st==='dunk'||st==='layup')){
    const bp=pr(B.x,B.y,B.z);arm(...sh(-9),bp.x-4*s,bp.y,s);arm(...sh(9),bp.x+4*s,bp.y,s);
  }else if(st==='shoot'||st==='dunk'||st==='layup'||st==='block'){
    arm(...sh(-9),X-5*s,Y-70*s,s);arm(...sh(9),X+5*s,Y-72*s,s);
  }else if(held&&st==='free'){
    const bp=pr(B.x,B.y,B.z);arm(...sh(p.hand*9),bp.x,bp.y,s);arm(...sh(-p.hand*9),X-p.hand*12*s,Y-22*s,s);
  }else if(B.mode==='held'&&B.owner===o.i&&dist(p.x,p.y,o.x,o.y)<95){
    arm(...sh(-9),X-17*s,Y-54*s,s);arm(...sh(9),X+17*s,Y-54*s,s);
  }else{
    arm(...sh(-9),X-12*s,Y-22*s+sw*4*s,s);arm(...sh(9),X+12*s,Y-22*s-sw*4*s,s);
  }
  ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(X,Y-46*s,6.5*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(X,Y-46*s,6.5*s,Math.PI,Math.PI*2);ctx.fill();
  if(spun)ctx.restore();
  ctx.textAlign='center';ctx.font=`bold ${Math.max(9,10*s)}px sans-serif`;
  ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(names[p.i],X,Y-58*s);ctx.fillStyle=p.i===me()?'#ffd84a':'#fff';ctx.fillText(names[p.i],X,Y-58*s);
  if(p.i===me()){ctx.fillStyle='#ffd84a';ctx.fillText('▼',X,Y-68*s)}
  if(p.stun>0)ctx.fillText('💫',X,Y-78*s);
}
function drawBall(){
  const g=pr(B.x,B.y,0),b=pr(B.x,B.y,B.z),r=7*b.s;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(g.x,g.y,r,r*0.4,0,0,7);ctx.fill();
  ctx.fillStyle='#f28a1e';ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.fill();
  ctx.strokeStyle='#4a2200';ctx.lineWidth=1;ctx.beginPath();
  ctx.arc(b.x,b.y,r,0,7);ctx.moveTo(b.x-r,b.y);ctx.lineTo(b.x+r,b.y);ctx.moveTo(b.x,b.y-r);ctx.lineTo(b.x,b.y+r);ctx.stroke();
}
function drawMeter(p){
  const show=p.state==='aim'||((p.state==='shoot'||p.state==='layup'||p.state==='dunk')&&p.st<0.5);
  if(!show)return;
  const g=greenInfo(p),m=pr(p.x,p.y,p.z),bh=80,bw=12;
  let bx=m.x+30;if(bx>W-24)bx=m.x-42;
  const by=Math.max(48,m.y-60*m.s-bh-14);
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(bx-2,by-2,bw+4,bh+4);
  ctx.fillStyle='#333';ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#2e2';ctx.fillRect(bx,by+bh*(1-(g.c+g.w/2)),bw,bh*g.w);
  ctx.fillStyle='#fc3';ctx.fillRect(bx,by+bh*(1-p.meter),bw,bh*p.meter);
  ctx.fillStyle='#fff';ctx.fillRect(bx-3,by+bh*(1-p.meter)-1,bw+6,3);
  ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';
  const nm=MV[p.move].name;ctx.strokeText(nm,bx+bw/2,by-6);ctx.fillStyle='#fff';ctx.fillText(nm,bx+bw/2,by-6);
}
function drawFx(){
  rings.forEach(r=>{
    if(r.t<0)return;
    const k=r.t/0.7,c=pr(RIM.x,RIM.y,RIMZ),rad=(14+k*70)*c.s*0.94;
    ctx.strokeStyle=`rgba(255,220,90,${1-k})`;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(c.x,c.y,rad,rad*0.45,0,0,Math.PI*2);ctx.stroke();
  });
  parts.forEach(p=>{const q=pr(p.x,p.y,p.z);ctx.globalAlpha=Math.min(1,p.life/0.4);ctx.fillStyle=p.c;ctx.fillRect(q.x-p.sz*q.s/2,q.y-p.sz*q.s/2,p.sz*q.s,p.sz*q.s)});
  ctx.globalAlpha=1;
}
function drawBanner(){
  if(!banner)return;
  const size=30+Math.max(0,(banner.life-1.15)*4)*18;
  ctx.globalAlpha=Math.min(1,banner.life*2);ctx.textAlign='center';
  ctx.font=`bold ${size}px sans-serif`;ctx.lineWidth=5;ctx.strokeStyle='#000';
  ctx.strokeText(banner.t,250,250);ctx.fillStyle=banner.c;ctx.fillText(banner.t,250,250);
  ctx.font='bold 18px sans-serif';ctx.lineWidth=3;ctx.strokeText(banner.sub,250,276);ctx.fillStyle='#fff';ctx.fillText(banner.sub,250,276);
  ctx.globalAlpha=1;
}
function drawTexts(){
  ctx.textAlign='center';ctx.font='bold 18px sans-serif';
  texts.forEach(t=>{const q=pr(t.x,t.y,t.z);ctx.globalAlpha=Math.min(1,t.life*2);ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(t.t,q.x,q.y);ctx.fillStyle=t.c;ctx.fillText(t.t,q.x,q.y)});
  ctx.globalAlpha=1;
}
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,W,40);ctx.fillStyle='#ffd84a';ctx.fillRect(0,38,W,2);
  [0,1].forEach(i=>{
    const left=i===0,x=left?12:W-12;
    ctx.fillStyle=TEAM[i].c;ctx.fillRect(left?0:W-5,0,5,38);
    ctx.textAlign=left?'left':'right';ctx.fillStyle='#ddd';ctx.font='12px sans-serif';
    ctx.fillText(names[i]+(i===me()?'(你)':'')+(started&&G2.off===i?' 🏀':''),x,15);
    const sc=1+scorePop[i]*0.5;
    ctx.save();ctx.translate(x,36);ctx.scale(sc,sc);ctx.fillStyle=scorePop[i]>0?'#ffd84a':'#fff';ctx.font='bold 24px sans-serif';ctx.fillText(G2.score[i],0,0);ctx.restore();
  });
  ctx.textAlign='center';ctx.fillStyle='#ffd84a';ctx.font='bold 12px sans-serif';ctx.fillText('先得 '+G2.target+' 分獲勝',250,15);
  ctx.fillStyle='#444';ctx.fillRect(200,22,100,9);
  const mp=PL[me()];ctx.fillStyle=mp.stamina>0.25?'#3cf':'#f55';ctx.fillRect(200,22,100*mp.stamina,9);
  if(started&&mp.state==='aim'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(40,44,420,20);
    ctx.fillStyle='#ffd84a';ctx.font='12px sans-serif';ctx.fillText('拖曳搖桿換動作: '+HINT[mp.mode],250,58);
  }
  if(started&&G2.phase==='check'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(130,300,240,28);
    ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.fillText(`${names[G2.next]} 進攻  ${Math.max(1,Math.ceil(G2.timer))}`,250,320);
  }
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*14,(Math.random()-.5)*shake*14);
  drawBackdrop();drawCourt();drawHoopBack();
  const items=[{y:PL[0].y,f:()=>drawPerson(PL[0])},{y:PL[1].y,f:()=>drawPerson(PL[1])},
    {y:B.mode==='held'?PL[B.owner].y+1:B.y,f:drawBall}];
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
  drawHoopFront();drawFx();drawMeter(PL[0]);drawMeter(PL[1]);drawTexts();
  ctx.restore();
  drawHUD();drawBanner();
}
let last=performance.now();
function loop(n){
  const dt=Math.min(0.04,(n-last)/1000);last=n;
  if(started){role==='host'?hostUpdate(dt):guestUpdate(dt)}
  updateFx(dt);updateLabels();syncOver();draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
